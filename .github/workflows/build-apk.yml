# Builds the Thunderfun Arcade app (signed with the KEYSTORE_PASSWORD secret) and publishes it on the Releases page.
# Runs when the app's code changes (not when only games.json changes), or on demand from the Actions tab.
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the Release

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing password secret is set
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions) and run this again."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VER=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          CODE=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "ThunderfunArcade-v${VER}.apk"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "file=ThunderfunArcade-v${VER}.apk" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VER}" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Keep a copy of the APK on this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish a new Release
        if: steps.apk.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.ver }}
          name: Thunderfun Arcade ${{ steps.apk.outputs.ver }}
          body: |
            Version ${{ steps.apk.outputs.ver }} (build ${{ steps.apk.outputs.code }}).
            On your phone: tap the APK below to download it, open it and choose Install.
          files: ${{ steps.apk.outputs.file }}
